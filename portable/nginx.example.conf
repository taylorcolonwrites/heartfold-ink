# Place inside the HTTPS server block for the real domain.
# Obtain/configure a valid certificate through the host's normal process first.
location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 12m;
    proxy_read_timeout 60s;
}
# Redirect HTTP and www to the one configured APP_ORIGIN.
# Leave the Node port bound to loopback; do not expose it directly to the internet.
